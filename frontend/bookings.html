<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My bookings · RevRes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <nav class="rail" aria-label="Main">
    <a class="rail-mark" href="/" aria-label="RevRes home">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
        <circle cx="11" cy="11" r="4.5" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="11" cy="3" r="1.6" fill="currentColor"/>
        <circle cx="11" cy="19" r="1.6" fill="currentColor"/>
        <circle cx="3" cy="11" r="1.6" fill="currentColor"/>
        <circle cx="19" cy="11" r="1.6" fill="currentColor"/>
      </svg>
    </a>
    <a class="rail-item" href="/" title="Restaurants">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <rect x="2.5" y="2.5" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/>
        <rect x="10.5" y="2.5" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/>
        <rect x="2.5" y="10.5" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/>
        <rect x="10.5" y="10.5" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <span class="rail-label">Restaurants</span>
    </a>
    <a class="rail-item is-active" href="bookings.html" title="Bookings" aria-current="page">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <rect x="2.5" y="3.5" width="13" height="12" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
        <path d="M2.5 7.5h13M6 2v3M12 2v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span class="rail-label">Bookings</span>
    </a>
    <a class="rail-item" href="admin.html" title="Admin" id="rail-admin" hidden>
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <path d="M11.5 2.5l4 4L6 16H2v-4l9.5-9.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
      <span class="rail-label">Admin</span>
    </a>
    <button class="rail-item rail-account" id="rail-account" type="button">
      <svg class="account-icon" width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <circle cx="9" cy="6" r="3" stroke="currentColor" stroke-width="1.5"/>
        <path d="M3.5 15.5c0-3 2.5-5 5.5-5s5.5 2 5.5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span class="account-initial" hidden></span>
      <span class="rail-label" id="rail-account-label">Log in</span>
    </button>
  </nav>

  <main class="canvas">
    <header class="title-row">
      <div class="title-block">
        <h1>My bookings</h1>
        <p class="subline" id="subline">Loading&hellip;</p>
      </div>
    </header>

    <section class="panel" aria-label="Your bookings" aria-live="polite">
      <ul class="list" id="list" hidden></ul>
      <p class="empty" id="empty" hidden></p>
    </section>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/bookings.js"></script>
</body>
</html>
